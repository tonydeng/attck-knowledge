[book]
title = "ATT&CK & ATLAS 知识库"
authors = ["Tony Deng"]
description = "MITRE ATT&CK® Enterprise 与 MITRE ATLAS 双矩阵中文知识库：ATT&CK Enterprise（15 战术 / 254 技术 / 617 子技术）+ MITRE ATLAS（AI/ML 对抗威胁矩阵，建设中）"
language = "zh-CN"
src = "src"

[build]
build-dir = "_book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.attck-preprocess]
command = "python scripts/mdbook-preprocessor.py"

[output.html]
no-section-label = true
default-theme = "catppuccin"
preferred-dark-theme = "catppuccin-mocha"
additional-css = ["theme/catppuccin.css", "theme/mermaid-fullscreen.css"]
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js", "theme/mermaid-fullscreen.js", "theme/cjk-search.js"]
git-repository-url = "https://github.com/tonydeng/attck-knowledge"
edit-url-template = "https://github.com/tonydeng/attck-knowledge/edit/main/src/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 15
use-boolean-and = true
boost-title = 5
boost-hierarchy = 3
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.fold]
enable = true
level = 0

[output.html.playground]
copyable = true

[output.html.code]
hidelines = {}
