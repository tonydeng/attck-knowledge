[book]
title = "ATT&CK 知识库"
authors = ["Tony Deng"]
description = "基于MITRE ATT&CK® v19 Enterprise矩阵的完整中文知识库，覆盖全部15 个战术、254 个技术和900+ 个子技术"
language = "zh-CN"
src = "src"

[build]
build-dir = "_book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
no-section-label = true
default-theme = "catppuccin"
preferred-dark-theme = "catppuccin-mocha"
additional-css = ["theme/catppuccin.css", "theme/mermaid-fullscreen.css"]
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js", "theme/mermaid-fullscreen.js", "theme/cjk-search.js"]
git-repository-url = "https://github.com/tonydeng/attck-knowledge"
edit-url-template = "https://github.com/tonydeng/attck-knowledge/edit/main/src/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 15
use-boolean-and = true
boost-title = 5
boost-hierarchy = 3
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.fold]
enable = true
level = 0

[output.html.playground]
copyable = true

[output.html.code]
hidelines = {}
